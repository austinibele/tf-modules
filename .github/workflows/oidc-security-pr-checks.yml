# Additive, AWS-free PR route; deployment workflows remain separate.
name: OIDC security PR checks
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  source-validation:
    name: OIDC security source validation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TF_IN_AUTOMATION: 'true'
      AWS_EC2_METADATA_DISABLED: 'true'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e
        with:
          terraform_version: '1.10.0'
          terraform_wrapper: false
      - name: Check changed module formatting
        run: terraform fmt -check -diff lambda_service manual_task ecs_task_dispatcher
      - name: Supply synthetic provider aliases for standalone validation
        run: |
          cat > manual_task/oidc-pr-providers.tf <<'HCL'
          provider "aws" {
            alias  = "iam"
            region = "us-east-1"
          }
          provider "aws" {
            alias  = "execution"
            region = "us-east-1"
          }
          HCL
      - name: Validate changed modules without backend or AWS access
        run: |
          set -euo pipefail
          for module in lambda_service manual_task ecs_task_dispatcher; do
            terraform -chdir="$module" init -backend=false -input=false
            terraform -chdir="$module" validate
          done
